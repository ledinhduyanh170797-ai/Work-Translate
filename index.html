<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Work Translate AI</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;background:#f4f6f8;color:#111827;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
  }
  .app{
    max-width:680px;margin:auto;min-height:100vh;
    display:flex;flex-direction:column;padding:18px 16px 22px;
  }
  .header{padding:8px 4px 18px}
  .title{font-size:25px;font-weight:800;letter-spacing:-.5px}
  .sub{margin-top:5px;color:#6b7280;font-size:14px}
  .card{
    background:white;border:1px solid #e5e7eb;border-radius:18px;
    box-shadow:0 3px 14px rgba(0,0,0,.05);overflow:hidden;
  }
  textarea{
    width:100%;min-height:150px;border:0;outline:0;resize:none;
    padding:18px;font-size:17px;line-height:1.55;color:#111827;
    font-family:inherit;background:white;
  }
  textarea::placeholder{color:#9ca3af}
  .actions{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;border-top:1px solid #eef0f2;
  }
  .hint{font-size:12px;color:#9ca3af;padding-left:6px}
  button{
    border:0;border-radius:12px;padding:11px 16px;font-weight:700;
    font-size:14px;cursor:pointer;
  }
  .translate{background:#111827;color:white}
  .translate:disabled{opacity:.5}
  .result{
    margin-top:14px;background:#111827;color:white;border-radius:18px;
    padding:18px;min-height:145px;display:flex;flex-direction:column;
  }
  .result-label{font-size:12px;color:#9ca3af;margin-bottom:10px}
  #output{
    font-size:18px;line-height:1.55;white-space:pre-wrap;flex:1;
  }
  .copy{
    align-self:flex-end;margin-top:16px;background:#fff;color:#111827;
  }
  .status{text-align:center;font-size:12px;color:#6b7280;margin-top:12px;min-height:18px}
  .settings{
    margin-top:auto;padding-top:18px;text-align:center;font-size:12px;color:#9ca3af;
  }
  @media (prefers-color-scheme: dark){
    body{background:#0b0f14;color:#f3f4f6}
    .card{background:#151a21;border-color:#252b34}
    textarea{background:#151a21;color:#f3f4f6}
    textarea::placeholder{color:#6b7280}
    .actions{border-color:#252b34}
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">Work Translate AI</div>
    <div class="sub">Việt ↔ English · Văn nói công việc</div>
  </div>

  <div class="card">
    <textarea id="input" placeholder="Nhập tiếng Việt hoặc English..."></textarea>
    <div class="actions">
      <span class="hint">AI tự nhận diện ngôn ngữ</span>
      <button class="translate" id="translateBtn">Dịch</button>
    </div>
  </div>

  <div class="result">
    <div class="result-label">KẾT QUẢ</div>
    <div id="output">Kết quả dịch sẽ xuất hiện ở đây.</div>
    <button class="copy" id="copyBtn">📋 Copy</button>
  </div>

  <div class="status" id="status"></div>
  <div class="settings">Bản 1.0</div>
</div>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const translateBtn = document.getElementById('translateBtn');
const copyBtn = document.getElementById('copyBtn');
const status = document.getElementById('status');

function setStatus(t){ status.textContent=t; }

function localFallback(text){
  return "Bản HTML này đã sẵn giao diện. Để AI dịch thực sự, cần kết nối OpenAI API.";
}

async function translate(){
  const text = input.value.trim();
  if(!text){ setStatus("Hãy nhập câu cần dịch."); input.focus(); return; }

  translateBtn.disabled = true;
  translateBtn.textContent = "Đang dịch...";
  setStatus("AI đang xử lý...");

  /*
    BẢN 1.0:
    Phần dưới là điểm kết nối AI.
    Khi đưa API key/backend vào, prompt này sẽ tự nhận diện Việt/English.
  */
  try {
    // Placeholder an toàn: không lưu API key trong file HTML.
    // Có thể kết nối backend/OpenAI ở phiên bản tiếp theo.
    const isVi = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(text);
    const pair = isVi ? "vi|en" : "en|vi";
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text.slice(0,500)) + "&langpair=" + encodeURIComponent(pair);
    const res = await fetch(url);
    const data = await res.json();
    if(!data.responseData || !data.responseData.translatedText) throw new Error("no result");
    output.textContent = data.responseData.translatedText;
    setStatus(isVi ? "Việt → Anh" : "Anh → Việt");
  } catch(e){
    output.textContent = "Có lỗi khi dịch.";
    setStatus("Vui lòng thử lại.");
  } finally {
    translateBtn.disabled = false;
    translateBtn.textContent = "Dịch";
  }
}

translateBtn.addEventListener('click', translate);

input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    translate();
  }
});

copyBtn.addEventListener('click', async () => {
  const text = output.textContent.trim();
  if(!text || text === "Kết quả dịch sẽ xuất hiện ở đây.") return;
  try{
    await navigator.clipboard.writeText(text);
    setStatus("Đã copy ✓");
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    setStatus("Đã copy ✓");
  }
});
</script>
</body>
</html>
